# 桌宠参数配置：改完重启生效。

# 走路速度（逻辑像素/秒）。1 逻辑像素 ≈ 1/1.25 个物理像素。
walk.speed.logical=30
# 一次踱步持续多久（秒）
walk.stretch.min.sec=8
walk.stretch.max.sec=20
# 踱步之间停多久（秒）
walk.pause.min.sec=3
walk.pause.max.sec=10

# 每隔多久躺下休息一次（分钟）
rest.interval.min.minutes=2
rest.interval.max.minutes=5
# 躺多久（秒）
rest.duration.min.sec=20
rest.duration.max.sec=60

# 微醺：左右摇摆幅度（度）与周期（秒）。0 = 关闭左右摇晃，正常行走
sway.tilt.deg=0
sway.period.sec=1.5
# 正式步态：约 12° 的髋部摆幅，脚底支撑由双骨求解；不再整体上下浮沉。
motion.hip.deg=12
# 收腿阶段脚底最大抬起高度（原生像素，显示时乘以2）。
motion.foot.lift.px=0.6
# 真实材质柔性骨相对静止方向的最大偏转，避免头发和衣摆翻折。
motion.hair.max.deg=6
motion.sleeve.max.deg=5
motion.coat.max.deg=6

# 踉跄：每隔多久一次（秒）与倾斜幅度（度）。0 = 关闭
stumble.interval.min.sec=20
stumble.interval.max.sec=40
stumble.tilt.deg=0

# 提灯单摆：最大摆角（度）、等效摆长（设备像素）、阻尼
lantern.max.deg=35
lantern.length.device=90
lantern.damping=1.1

# 柔性链（发丝 / 袖子 / 袍摆）：Verlet 积分加距离约束，重力对所有链一样。
# segments  = 模拟节数，沿模拟链采样到素材的固定骨节，改配置不破坏绑骨。
# seg.length= 每节模拟长度（原生像素）
# max.deg   = 每个关节相对上一节能弯的最大角度；调大发丝甩得更野
# damping   = 阻尼（1/秒）：越大越早停住。2.5 大约等于停摆后 4～5 秒落定；
#             调到 6 大约 2 秒；别设 0，设 0 会一直摆下去。
# 每条链各调各的，改完重启生效；只改一条不影响别的链。
chain.gravity=900

chain.hair.segments=3
chain.hair.seg.length=12
chain.hair.max.deg=35
chain.hair.damping=2.5

chain.sleeve.segments=2
chain.sleeve.seg.length=10
chain.sleeve.max.deg=35
chain.sleeve.damping=2.5

chain.coat.segments=2
chain.coat.seg.length=12
chain.coat.max.deg=35
chain.coat.damping=2.5

# 菜单：外接圆半径与按钮直径（逻辑像素）
menu.radius.logical=105
button.diameter.logical=56
